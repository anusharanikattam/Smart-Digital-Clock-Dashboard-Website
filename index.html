<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeVerse Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>⏰ TimeVerse</h1>
    <p>Smart Digital Clock Dashboard</p>

    <div class="clock-card">
        <h2 id="digitalClock">00:00:00</h2>
        <p id="date"></p>
    </div>

    <div class="analog-clock">
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
    </div>

    <div class="cards">

        <div class="card">
            <h3>⏰ Alarm</h3>
            <input type="time" id="alarmTime">
            <button onclick="setAlarm()">Set Alarm</button>
        </div>

        <div class="card">
            <h3>⏱ Stopwatch</h3>
            <h2 id="stopwatch">00:00:00</h2>
            <button onclick="startStopwatch()">Start</button>
            <button onclick="resetStopwatch()">Reset</button>
        </div>

        <div class="card">
            <h3>🌍 World Clock</h3>
            <p id="worldClock"></p>
        </div>

        <div class="card">
            <h3>🔋 Battery</h3>
            <p id="battery">Loading...</p>
        </div>

        <div class="card">
            <h3>📅 Calendar</h3>
            <input type="date">
        </div>

        <div class="card">
            <h3>🌦 Weather</h3>
            <p>28°C Sunny</p>
        </div>

        <div class="card">
            <h3>💡 Motivation</h3>
            <p>Stay focused and productive.</p>
        </div>

        <div class="card">
            <h3>📈 Productivity</h3>
            <p>85% Completed</p>
        </div>

    </div>

    <div class="todo">
        <h3>📝 To-Do List</h3>
        <input type="text" id="taskInput">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
